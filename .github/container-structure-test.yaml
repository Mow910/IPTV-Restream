# Container Structure Test Configuration
# Tests the Docker image structure and contents

schemaVersion: '2.0.0'

commandTests:
  - name: 'Node version check'
    setup: [['node', '--version']]
    command: 'node'
    args: ['--version']
    excludedOutput: []
    excludedErrorOutput: []
    exitCode: 0

  - name: 'npm is installed'
    command: 'npm'
    args: ['--version']
    excludedOutput: []
    exitCode: 0

fileExistenceTests:
  - name: 'package.json exists'
    path: '/app/package.json'
    shouldExist: true
    permissions: '-rw-r--r--'

  - name: 'node_modules exists'
    path: '/app/node_modules'
    shouldExist: true

  - name: 'No root owned files (security check)'
    path: '/app'
    shouldExist: true
    permissions: '-rwxr-xr-x'

fileContentTests:
  - name: 'Dockerfile has no sudo'
    path: '/etc/os-release'
    excludedContents: ['sudo']
    excludedOutput: []

metadataTest:
  labels:
    - key: 'org.opencontainers.image.source'
      value: 'https://github.com/antebrl/iptv-restream'
  
  user: 'node'
  
  workdir: '/app'
  
  exposedPorts: ['5000']
  
  volumes: ['/streams', '/channels']
