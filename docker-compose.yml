version: "3.9"

services:
  iptv_restream_frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Set this to the server ip/domain, if your backend is deployed on a different server
        #VITE_BACKEND_URL: http://123.123.123.123:5000
        VITE_STREAM_DELAY: 18
        VITE_STREAM_PROXY_DELAY: 30
        # Optional settings for synchronization
        #VITE_SYNCHRONIZATION_TOLERANCE: 0.8
        #VITE_SYNCHRONIZATION_MAX_DEVIATION: 4
        #VITE_SYNCHRONIZATION_ADJUSTMENT: 0.06
        #VITE_SYNCHRONIZATION_MAX_ADJUSTMENT: 0.16

    container_name: iptv_restream_frontend
    restart: unless-stopped
    networks:
      - app-network
    
    # Health check
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5173"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  iptv_restream_backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        NODE_ENV: production
    
    container_name: iptv_restream_backend
    restart: unless-stopped
    
    # User mapping for file permissions (optional, customize as needed)
    # user: "${PUID:-1000}:${PGID:-1000}"
    
    volumes:
      - streams_data:/streams
      - channels:/channels
      - ./backend/logs:/app/logs
    
    environment:
      # Core settings
      NODE_ENV: production
      PORT: 5000
      STORAGE_PATH: /streams/
      
      # Admin mode configuration
      ADMIN_ENABLED: "${ADMIN_ENABLED:-false}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      CHANNEL_SELECTION_REQUIRES_ADMIN: "${CHANNEL_SELECTION_REQUIRES_ADMIN:-false}"
      JWT_EXPIRY: "24h"
      
      # Security settings
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-}"
      BACKEND_URL: "${BACKEND_URL:-http://localhost:5000}"
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost}"
      
      # Optional: FFmpeg settings
      #FFMPEG_PATH: /usr/bin/ffmpeg
      #FFMPEG_BUFFER_SIZE: 1024k

    networks:
      - app-network
    
    # Health check
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5000/api/channels"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '1'
          memory: 512M
    
    # Security options
    security_opt:
      - no-new-privileges:true
    
    depends_on:
      - iptv_restream_nginx

  # Nginx Reverse Proxy
  iptv_restream_nginx:
    image: nginx:alpine
    container_name: iptv_restream_nginx
    restart: unless-stopped
    
    volumes:
      - ./deployment/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - streams_data:/streams:ro
    
    ports:
      - "${HTTP_PORT:-80}:80"
      # Uncomment for HTTPS
      # - "${HTTPS_PORT:-443}:443"
      # - ./deployment/nginx/certs:/etc/nginx/certs:ro
    
    networks:
      - app-network
    
    # Health check
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    
    # Security options
    security_opt:
      - no-new-privileges:true
    
    depends_on:
      - iptv_restream_backend

volumes:
  streams_data:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=2G"
  
  channels:
    driver: local

# Internal docker network
networks:
  app-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16
